name: CI/CD Pipeline - SteamSentimentAnalysis

on:
  push:
    branches: [ "main" ] # Se ejecuta automáticamente al hacer push a main

env:
  REGISTRY: ghcr.io
  # Forzamos el nombre de la imagen completamente a minúsculas usando una función interna
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de Docker (Tags y Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Convertimos a minúsculas en el paso del build
          images: ${{ env.REGISTRY }}/${{ lower(env.IMAGE_NAME) }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y subir Imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Solo corre si el build funciona

    steps:
      - name: Desplegar en el servidor vía SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          REGISTRY: ${{ env.REGISTRY }}
          # Convertimos a minúsculas también en el entorno del deploy
          IMAGE_NAME: ${{ lower(env.IMAGE_NAME) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: CONNECTION_STRING,REGISTRY,IMAGE_NAME,GH_TOKEN,GH_ACTOR
          script: |
            # 0. Asegurar que la red de Docker exista en el VPS
            docker network create steam-sentiment || true

            # 1. Autenticar Docker en el registro de GitHub
            echo "$GH_TOKEN" | docker login $REGISTRY -u $GH_ACTOR --password-stdin

            # 2. Descargar la última versión de la imagen (Ahora sí irá en minúsculas)
            docker pull $REGISTRY/$IMAGE_NAME:latest

            # 3. Detener y eliminar el contenedor anterior si ya existe
            docker stop steam-api || true
            docker rm steam-api || true

            # 4. Correr tu contenedor conectado a la red 'steam-sentiment'
            docker run -d -p 5002:8080 \
              -e "MongoDbSettings__ConnectionString=$CONNECTION_STRING" \
              --network steam-sentiment \
              --add-host=host.docker.internal:host-gateway \
              --name steam-api \
              --restart unless-stopped \
              $REGISTRY/$IMAGE_NAME:latest

            # 5. Limpieza de imágenes huérfanas
            docker image prune -f